name: Draft GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: Create draft release (does not publish to npm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --draft --generate-notes --title "${GITHUB_REF_NAME}"
